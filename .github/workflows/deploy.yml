name: Deploy Booker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild images from scratch (--no-cache)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # Build FIRST (the site keeps serving the old containers), through the host-wide guard:
          # it refuses to build when disk < 8 G or MemAvailable < 5 G and caps the build at 4 G RAM,
          # so a build can fail (exit 137) but can no longer take the whole host down
          # (2026-09-05/07 outages). Exit 2 = built OK but disk is low afterwards -> still deploy,
          # `image prune` below reclaims. Then `up -d` recreates only what changed (seconds of
          # downtime instead of the whole build). --no-cache only on manual dispatch.
          script: |
            set -o pipefail
            cd /var/www/miracall.net/booker
            git pull origin main
            # script_stop makes the action append an exit-on-nonzero check after EVERY line, so no
            # bare `[ … ] && …` (it returns 1 when the test is false and killed run 34146925640).
            NC=""; if [ "${{ inputs.no_cache }}" = "true" ]; then NC="--no-cache"; fi
            for svc in booker calibre; do
              rc=0; sudo -n /usr/local/bin/safe-docker-build compose -f docker-compose.yml build "$svc" $NC || rc=$?
              [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
            done
            docker compose up -d
            docker image prune -f
